name: quisp ci image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/ci-image.yml
      - .omnetpp-version
      - docker/ci/**
  pull_request:
    paths:
      - .github/workflows/ci-image.yml
      - .omnetpp-version
      - docker/ci/**

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ngym/quisp-ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read OMNeT++ version
        id: omnetpp
        run: |
          tag="$(cat .omnetpp-version)"
          version="${tag#omnetpp-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CI image
        uses: docker/build-push-action@v6
        with:
          context: docker/ci
          file: docker/ci/Dockerfile
          build-args: |
            OMNETPP_VERSION=${{ steps.omnetpp.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.omnetpp.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.omnetpp.outputs.tag }}-${{ github.sha }}
